<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Microchip Pins -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <!-- Top & Bottom pins -->
    <line x1="24" y1="12" x2="24" y2="17" />
    <line x1="32" y1="12" x2="32" y2="17" />
    <line x1="40" y1="12" x2="40" y2="17" />
    <line x1="24" y1="47" x2="24" y2="52" />
    <line x1="32" y1="47" x2="32" y2="52" />
    <line x1="40" y1="47" x2="40" y2="52" />
    <!-- Left & Right pins -->
    <line x1="12" y1="24" x2="17" y2="24" />
    <line x1="12" y1="32" x2="17" y2="32" />
    <line x1="12" y1="40" x2="17" y2="40" />
    <line x1="47" y1="24" x2="52" y2="24" />
    <line x1="47" y1="32" x2="52" y2="32" />
    <line x1="47" y1="40" x2="52" y2="40" />
  </g>

  <!-- Chip Body -->
  <rect x="17" y="17" width="30" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />

  <!-- Central AI Sparkle / Star -->
  <path d="M 32 21 C 32 27.5, 36.5 32, 43 32 C 36.5 32, 32 36.5, 32 43 C 32 36.5, 27.5 32, 21 32 C 27.5 32, 32 27.5, 32 21 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  
  <!-- Subtle center node -->
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
